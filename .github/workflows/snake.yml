name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Madhu-Dontukurthi
          outputs: |
            dist/github-snake.svg?color_snake=%23196127&color_dots=%23ebedf0,%239be9a8,%2340c463,%2330a14e,%23216e39&color_empty=%23ebedf0

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
